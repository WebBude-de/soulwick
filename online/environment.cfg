; Build environment of exported games (MP4, platform P-018): development or production.
; The editor and every run of the editor binary ignore this file and use localhost.
; tools/export_build.ps1 / tools/export_build.sh set env for one export and restore this file.
; Never put a dev key here: it would be packed into the build (see docs/MULTIPLAYER.md §3d).
[build]
env="development"
