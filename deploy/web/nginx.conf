# nginx of the soulwick-game image (Dockerfile, docs/WEB_BUILD.md): serves the web export of the
# game. TLS ends at Traefik (Dokploy) behind Cloudflare; this server only speaks HTTP on port 80.

include /etc/nginx/modules/*.conf;

worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	access_log /dev/stdout combined;
	sendfile on;
	tcp_nopush on;
	keepalive_timeout 65;
	server_tokens off;
	# Relative redirects keep the public host and scheme (TLS ends in front of this server).
	absolute_redirect off;

	# Files are pre-compressed in the image (.br, .gz); dynamic gzip only for the rest.
	brotli_static on;
	gzip_static on;
	gzip on;
	gzip_vary on;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

	map $uri $cache_control {
		# Page, service worker, manifest: always ask the server, so a new version arrives at once.
		~*\.html$                    "no-cache";
		~*\.service\.worker\.js$     "no-cache";
		~*\.manifest\.json$          "no-cache";
		# The game files keep their names in every version (index.pck, index.wasm, index.js):
		# the browser may keep them but must check them (ETag, answer 304 when unchanged). The
		# service worker keeps its own copy for the installed app and the offline start.
		~*\.(pck|wasm|js)$           "no-cache";
		# Font and icons rarely change.
		~*\.(ttf|woff2?)$            "public, max-age=2592000";
		~*\.png$                     "public, max-age=86400";
		default                      "no-cache";
	}

	server {
		listen 80 default_server;
		listen [::]:80 default_server;
		server_name _;
		root /usr/share/nginx/html;
		index index.html;
		charset utf-8;
		charset_types text/css application/javascript application/json application/manifest+json text/plain;

		# Cross-origin isolation: not needed by the single-threaded build, but kept so a later
		# build with threads works and the service worker sees the same headers.
		add_header Cross-Origin-Opener-Policy "same-origin" always;
		add_header Cross-Origin-Embedder-Policy "require-corp" always;
		add_header Cross-Origin-Resource-Policy "same-origin" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Cache-Control $cache_control always;
		# development: X-Robots-Tag noindex (written by the Dockerfile; empty in production).
		include /etc/nginx/soulwick-env.conf;

		# Own page for paths that do not exist (DE/EN, link to the game).
		error_page 404 /404.html;

		location = /404.html {
			internal;
		}

		location = /healthz {
			access_log off;
			default_type text/plain;
			return 200 "ok\n";
		}

		location = / {
			try_files /index.html =404;
		}

		location ~* \.wasm$ {
			types { }
			default_type application/wasm;
			try_files $uri =404;
		}

		location ~* \.pck$ {
			types { }
			default_type application/octet-stream;
			try_files $uri =404;
		}

		location ~* \.ttf$ {
			types { }
			default_type font/ttf;
			try_files $uri =404;
		}

		location ~* \.manifest\.json$ {
			types { }
			default_type application/manifest+json;
			try_files $uri =404;
		}

		location ~* \.service\.worker\.js$ {
			# add_header in a location replaces the server ones: repeat them.
			add_header Cross-Origin-Opener-Policy "same-origin" always;
			add_header Cross-Origin-Embedder-Policy "require-corp" always;
			add_header Cross-Origin-Resource-Policy "same-origin" always;
			add_header X-Content-Type-Options "nosniff" always;
			add_header Referrer-Policy "strict-origin-when-cross-origin" always;
			add_header Cache-Control $cache_control always;
			add_header Service-Worker-Allowed "/" always;
			include /etc/nginx/soulwick-env.conf;
			try_files $uri =404;
		}

		location / {
			try_files $uri =404;
		}
	}
}
