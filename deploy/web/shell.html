<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15131f">
<meta name="color-scheme" content="dark">
<meta name="description" content="Soulwick – a dark dungeon roguelite. Play right in your browser.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>$GODOT_PROJECT_NAME</title>
<!-- Custom HTML shell of the "Web" export preset (docs/WEB_BUILD.md). Icons come from the PWA
     options of the preset (index.<size>x<size>.png); the font is copied next to the page by the
     Dockerfile and falls back to a monospace font elsewhere. -->
<link rel="icon" type="image/png" href="index.144x144.png">
<link rel="apple-touch-icon" href="index.180x180.png">
<style>
@font-face {
	font-family: "Pixelify Sans";
	src: url("fonts/PixelifySans-Variable.ttf") format("truetype");
	font-weight: 400 700;
	font-display: swap;
}

:root {
	--bg: #15131f;
	--bg-deep: #0b0a11;
	--panel: #221f31;
	--edge: #3a3550;
	--text: #e9e4d2;
	--muted: #b9b3c9;
	--dim: #7a7396;
	--gold: #f2cf4a;
	--gold-deep: #b8932a;
	--soul: #a98cf5;
	--shadow: #1c1a2b;
	--danger: #e0463a;
	--px: 3px;
}

html, body {
	margin: 0;
	padding: 0;
	height: 100%;
	background: var(--bg-deep);
	color: var(--text);
	overflow: hidden;
	touch-action: none;
	-webkit-tap-highlight-color: transparent;
	-webkit-user-select: none;
	user-select: none;
}

body {
	font-family: "Pixelify Sans", "Courier New", monospace;
}

#canvas {
	display: block;
	margin: 0;
	padding: 0;
	border: 0;
}

#canvas:focus {
	outline: none;
}

/* ---------------------------------------------------------------- start screen */

#shell {
	position: fixed;
	inset: 0;
	z-index: 10;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 28px;
	padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
	box-sizing: border-box;
	background:
		radial-gradient(ellipse at 50% 42%, rgba(169, 140, 245, 0.10) 0%, rgba(21, 19, 31, 0) 38%),
		radial-gradient(ellipse at 50% 45%, var(--bg) 0%, var(--bg-deep) 78%);
	cursor: default;
	transition: opacity 0.35s ease;
}

#shell.ready {
	cursor: pointer;
}

#shell.leaving {
	opacity: 0;
	pointer-events: none;
}

.logo-wrap {
	position: relative;
	display: flex;
	justify-content: center;
}

.logo-wrap::before {
	content: "";
	position: absolute;
	left: 50%;
	top: 50%;
	width: 340px;
	height: 220px;
	transform: translate(-50%, -50%);
	background: radial-gradient(ellipse, rgba(169, 140, 245, 0.22) 0%, rgba(169, 140, 245, 0) 65%);
	animation: flicker 3.2s infinite steps(1);
	pointer-events: none;
}

#logo {
	position: relative;
	width: 480px;
	height: 144px;
	image-rendering: pixelated;
	image-rendering: crisp-edges;
	filter: drop-shadow(0 var(--px) 0 var(--shadow));
}

@media (max-width: 540px), (max-height: 420px) {
	#logo {
		width: 320px;
		height: 96px;
	}
	:root {
		--px: 2px;
	}
}

/* Phones held sideways: little height, keep logo, start text and the install button apart. */
@media (max-height: 420px) {
	#shell {
		gap: 16px;
	}
}

@keyframes flicker {
	0% { opacity: 1; }
	18% { opacity: 0.82; }
	22% { opacity: 1; }
	47% { opacity: 0.9; }
	63% { opacity: 1; }
	81% { opacity: 0.78; }
	86% { opacity: 1; }
}

.loader {
	width: min(360px, 82vw);
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 12px;
}

.bar {
	position: relative;
	width: 100%;
	height: 18px;
	box-sizing: border-box;
	background: var(--bg-deep);
	box-shadow:
		0 calc(-1 * var(--px)) 0 0 var(--edge),
		0 var(--px) 0 0 var(--edge),
		calc(-1 * var(--px)) 0 0 0 var(--edge),
		var(--px) 0 0 0 var(--edge),
		0 calc(2 * var(--px)) 0 0 var(--shadow);
}

.bar-fill {
	position: absolute;
	left: 3px;
	top: 3px;
	bottom: 3px;
	width: 0;
	max-width: calc(100% - 6px);
	background:
		repeating-linear-gradient(90deg, transparent 0 9px, rgba(0, 0, 0, 0.28) 9px 12px),
		linear-gradient(180deg, var(--gold) 0 55%, var(--gold-deep) 55% 100%);
	transition: width 0.2s linear;
}

.bar.indeterminate .bar-fill {
	width: 30%;
	animation: sweep 1.2s infinite linear;
}

@keyframes sweep {
	from { left: 3px; }
	to { left: 68%; }
}

#status {
	min-height: 1.4em;
	font-size: 18px;
	color: var(--muted);
	text-align: center;
	text-shadow: 2px 2px 0 var(--shadow);
	letter-spacing: 0.02em;
}

#start {
	display: none;
	font-size: 26px;
	color: var(--gold);
	text-shadow: var(--px) var(--px) 0 var(--shadow);
	letter-spacing: 0.04em;
	animation: pulse 1.6s infinite steps(2);
}

#start-sub {
	display: none;
	font-size: 15px;
	color: var(--dim);
	text-align: center;
}

#shell.ready .loader,
#shell.failed .loader {
	display: none;
}

#shell.ready #start,
#shell.ready #start-sub {
	display: block;
}

@keyframes pulse {
	0% { opacity: 1; }
	50% { opacity: 0.55; }
}

/* ---------------------------------------------------------------- failure */

#failure {
	display: none;
	max-width: 440px;
	text-align: center;
	font-size: 18px;
	line-height: 1.4;
	color: var(--text);
}

#shell.failed #failure {
	display: block;
}

#failure strong {
	display: block;
	margin-bottom: 8px;
	font-size: 22px;
	font-weight: 600;
	color: var(--danger);
	text-shadow: 2px 2px 0 var(--shadow);
}

/* ---------------------------------------------------------------- buttons */

.btn {
	font: inherit;
	font-size: 17px;
	color: var(--text);
	background: var(--panel);
	border: 0;
	padding: 9px 18px;
	cursor: pointer;
	box-shadow:
		0 calc(-1 * var(--px)) 0 0 var(--edge),
		0 var(--px) 0 0 var(--edge),
		calc(-1 * var(--px)) 0 0 0 var(--edge),
		var(--px) 0 0 0 var(--edge),
		0 calc(2 * var(--px)) 0 0 var(--shadow);
	text-shadow: 2px 2px 0 var(--shadow);
}

.btn:hover,
.btn:focus-visible {
	outline: none;
	color: var(--gold);
	box-shadow:
		0 calc(-1 * var(--px)) 0 0 var(--gold-deep),
		0 var(--px) 0 0 var(--gold-deep),
		calc(-1 * var(--px)) 0 0 0 var(--gold-deep),
		var(--px) 0 0 0 var(--gold-deep),
		0 calc(2 * var(--px)) 0 0 var(--shadow);
}

.btn.primary {
	color: var(--bg);
	background: var(--gold);
	text-shadow: none;
}

.btn.primary:hover,
.btn.primary:focus-visible {
	color: var(--bg);
	background: #ffe27a;
}

.btn[hidden] {
	display: none;
}

#install-btn {
	position: fixed;
	right: max(16px, env(safe-area-inset-right));
	bottom: max(16px, env(safe-area-inset-bottom));
	display: flex;
	align-items: center;
	gap: 10px;
	font-size: 16px;
}

#install-btn[hidden] {
	display: none;
}

#install-btn svg {
	width: 18px;
	height: 18px;
	shape-rendering: crispEdges;
}

#footer {
	position: fixed;
	left: max(16px, env(safe-area-inset-left));
	bottom: max(18px, env(safe-area-inset-bottom));
	font-size: 13px;
	color: var(--dim);
}

#footer .heart {
	color: var(--danger);
}

#footer a {
	color: var(--dim);
	text-decoration: underline;
	text-underline-offset: 2px;
}

#footer a:hover,
#footer a:focus-visible {
	color: var(--gold);
	outline: none;
}

/* Narrow phones (portrait): the install button sits centred above the footer, not on top of it. */
@media (max-width: 520px) {
	#install-btn {
		left: 50%;
		right: auto;
		bottom: calc(max(16px, env(safe-area-inset-bottom)) + 30px);
		transform: translateX(-50%);
		white-space: nowrap;
	}

	#footer {
		left: 0;
		right: 0;
		text-align: center;
	}
}

/* ---------------------------------------------------------------- install dialog */

#install-panel {
	position: fixed;
	inset: 0;
	z-index: 20;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 16px;
	box-sizing: border-box;
	background: rgba(11, 10, 17, 0.78);
	cursor: default;
}

#install-panel[hidden] {
	display: none;
}

.panel {
	position: relative;
	width: min(420px, 100%);
	box-sizing: border-box;
	padding: 22px 22px 20px;
	background: var(--panel);
	box-shadow:
		0 calc(-1 * var(--px)) 0 0 var(--gold-deep),
		0 var(--px) 0 0 var(--gold-deep),
		calc(-1 * var(--px)) 0 0 0 var(--gold-deep),
		var(--px) 0 0 0 var(--gold-deep),
		0 calc(3 * var(--px)) 0 0 var(--shadow);
	font-size: 17px;
	line-height: 1.45;
	color: var(--muted);
}

.panel h2 {
	margin: 0 0 10px;
	font-size: 22px;
	font-weight: 600;
	color: var(--gold);
	text-shadow: 2px 2px 0 var(--shadow);
}

.panel p {
	margin: 0 0 12px;
}

.panel ol {
	margin: 0 0 12px;
	padding-left: 1.4em;
	color: var(--text);
}

.panel ol li {
	margin-bottom: 4px;
}

.panel .share {
	display: inline-block;
	width: 14px;
	height: 16px;
	vertical-align: -2px;
}

.panel .actions {
	display: flex;
	flex-wrap: wrap;
	justify-content: flex-end;
	gap: 14px;
	margin-top: 18px;
}

[data-when] {
	display: none;
}

@media (prefers-reduced-motion: reduce) {
	.logo-wrap::before,
	#start,
	.bar.indeterminate .bar-fill {
		animation: none;
	}
}
</style>
$GODOT_HEAD_INCLUDE
</head>

<script>
// Co-op keep-alive (D-183): a hidden tab gets no requestAnimationFrame, so a host's game (and with
// it every client) stood still while its window was in the background. Godot's main loop asks for
// every frame through the global requestAnimationFrame, so this wrapper decides how a frame comes:
// visible = the browser's own frames; hidden while the game has the keep-alive on (in a co-op
// room, online/web_keep_alive.gd) = ticks of a small worker (worker timers are not throttled like
// those of a hidden page; plain timers here are the fallback). Single player never switches it on.
(function () {
	'use strict';
	if (typeof window.requestAnimationFrame !== 'function' || typeof window.cancelAnimationFrame !== 'function') {
		return;
	}
	const TICK_MS = 16; // TESTWERT: frame interval while hidden (about 60 per second, nothing is drawn).
	const nativeRequest = window.requestAnimationFrame.bind(window);
	const nativeCancel = window.cancelAnimationFrame.bind(window);
	const pending = new Map(); // id -> { callback, native }
	let nextId = 1;
	let keepAlive = false;
	let ticking = false;
	let worker = null;
	let fallbackTimer = 0;
	const stats = { ticks: 0, longestGapMs: 0, lastGapMs: 0, hiddenPeriods: 0, worker: false, lastTickAt: 0 };

	function isHidden() {
		return document.visibilityState === 'hidden';
	}

	function run(id, time) {
		const entry = pending.get(id);
		if (!entry) {
			return;
		}
		pending.delete(id);
		entry.callback(time);
	}

	window.requestAnimationFrame = function (callback) {
		const id = nextId++;
		const entry = { callback, native: 0 };
		pending.set(id, entry);
		entry.native = nativeRequest((time) => run(id, time));
		return id;
	};
	window.cancelAnimationFrame = function (id) {
		const entry = pending.get(id);
		if (entry) {
			pending.delete(id);
			nativeCancel(entry.native);
		}
	};

	// One hidden "frame": every callback waiting right now runs once (new requests wait for the next tick).
	function tick() {
		if (!ticking) {
			return;
		}
		const now = performance.now();
		if (stats.lastTickAt > 0) {
			stats.lastGapMs = Math.round(now - stats.lastTickAt);
			stats.longestGapMs = Math.max(stats.longestGapMs, stats.lastGapMs);
		}
		stats.lastTickAt = now;
		stats.ticks += 1;
		for (const id of Array.from(pending.keys())) {
			const entry = pending.get(id);
			if (!entry) {
				continue;
			}
			nativeCancel(entry.native);
			try {
				run(id, now);
			} catch (err) {
				(window.reportError || console.error)(err);
			}
		}
	}

	function startTicks() {
		ticking = true;
		stats.hiddenPeriods += 1;
		stats.lastTickAt = 0;
		if (!worker && typeof Worker === 'function') {
			try {
				const source = 'let t=0;onmessage=(e)=>{clearInterval(t);t=0;if(e.data>0){t=setInterval(()=>postMessage(0),e.data);}};';
				worker = new Worker(URL.createObjectURL(new Blob([source], { type: 'text/javascript' })));
				worker.onmessage = tick;
			} catch (err) {
				console.warn('Keep-alive worker unavailable, using timers:', err);
				worker = null;
			}
		}
		stats.worker = !!worker;
		if (worker) {
			worker.postMessage(TICK_MS);
		} else {
			fallbackTimer = window.setInterval(tick, TICK_MS);
		}
	}

	function stopTicks() {
		ticking = false;
		if (worker) {
			worker.postMessage(0);
		}
		if (fallbackTimer) {
			window.clearInterval(fallbackTimer);
			fallbackTimer = 0;
		}
	}

	function update() {
		const want = keepAlive && isHidden();
		if (want && !ticking) {
			startTicks();
		} else if (!want && ticking) {
			// Visible again: the waiting callbacks still hold a real frame request and run with it.
			stopTicks();
		}
	}

	document.addEventListener('visibilitychange', update);
	window.soulwickShell = Object.freeze({
		setKeepAlive(on) {
			keepAlive = !!on;
			update();
			return keepAlive;
		},
		isHidden,
		stats() {
			return {
				keepAlive, hidden: isHidden(), ticking, worker: stats.worker, ticks: stats.ticks,
				hiddenPeriods: stats.hiddenPeriods, lastGapMs: stats.lastGapMs, longestGapMs: stats.longestGapMs,
			};
		},
	});
}());
</script>

							apply(worker);
						}
					});
				}
			});
		}).catch(() => {});
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail(new Error(`Missing browser features: ${missing.join(', ')}`), true);
		return;
	}

	const engine = new Engine(Object.assign({}, GODOT_CONFIG, { onProgress }));
	const executable = GODOT_CONFIG.executable;
	const mainPack = GODOT_CONFIG.mainPack || `${executable}.pck`;
	watchForUpdates();

	Promise.all([engine.init(executable), engine.preloadFile(mainPack, mainPack)]).then(() => {
		if (state !== 'loading') {
			return;
		}
		state = 'ready';
		shell.classList.add('ready');
		// An open install dialog (?install) keeps the focus, so Escape and its buttons still work.
		if (installPanel.hidden) {
			shell.focus();
		}
	}, (err) => fail(err, false));

	function startGame() {
		if (state !== 'ready') {
			return;
		}
		state = 'starting';
		shell.classList.remove('ready');
		$('start').style.display = 'none';
		$('start-sub').style.display = 'none';
		statusText.textContent = T.starting;
		shell.querySelector('.loader').style.display = 'flex';
		bar.style.display = 'none';
		engine.start({ args: gameArgs() }).then(() => {
			state = 'running';
			document.body.classList.add('running');
			shell.classList.add('leaving');
			window.setTimeout(() => shell.remove(), 400);
			installPanel.remove();
		}, (err) => fail(err, false));
	}

	shell.addEventListener('click', startGame);
	// Escape closes the install dialog wherever the focus is.
	document.addEventListener('keydown', (event) => {
		if (event.key === 'Escape' && installPanel.isConnected && !installPanel.hidden) {
			closeInstall();
		}
	});
	shell.addEventListener('keydown', (event) => {
		if (!installPanel.hidden) {
			return;
		}
		if (event.key === 'Enter' || event.key === ' ') {
			event.preventDefault();
			startGame();
		}
	});
}());
</script>
</body>
</html>
