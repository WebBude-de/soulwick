# Checks every push to main/dev and every pull request: all files load (validate_project.gd) and the
# GUT unit tests pass (AGENTS.md §7); workflows and CI scripts pass actionlint and shellcheck.
# Exports and releases: release.yml.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Workflows and shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        # Preinstalled on GitHub's Ubuntu runners.
        run: shellcheck --version | head -n 2 && shellcheck -x tools/*.sh tools/ci/*.sh tools/steam/*.sh
      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  test:
    name: Validate and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - id: godot
        uses: ./.github/actions/setup-godot
      - name: Validate project
        env:
          GODOT: ${{ steps.godot.outputs.godot }}
        run: '"$GODOT" --headless --audio-driver Dummy --path . -s tools/validate_project.gd'
      - name: Unit tests (GUT)
        env:
          GODOT: ${{ steps.godot.outputs.godot }}
          # Some tests expect the German texts of language "auto" (system language), as on the
          # team's PCs; Godot reads the system language from LANG on Linux.
          LANG: de_DE.UTF-8
        run: '"$GODOT" --headless --audio-driver Dummy --path . -s addons/gut/gut_cmdln.gd -gexit'
