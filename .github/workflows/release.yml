# Builds Soulwick for Windows, Linux, macOS and Android and publishes them as a GitHub release
# (docs/RELEASE.md); prepares the store builds (docs/STORES.md): Google Play bundle, iOS Xcode
# project / IPA, Steam upload. The browser version is built and hosted by Dokploy (deploy/), not here.
#
#   git tag v0.9.1 && git push origin v0.9.1         -> release v0.9.1
#   git tag v0.9.1-beta.1 && git push origin ...     -> pre-release v0.9.1-beta.1 (test servers)
#   Actions -> Release -> Run workflow               -> release with the chosen environment; the tag
#                                                       (v<version> or v<version>-dev.<run>) is created
#   git push origin dev                              -> pre-release v<version>-dev.<run> (test servers),
#                                                       no store uploads; only the newest
#                                                       DEV_RELEASES_KEPT dev pre-releases stay (D-157)
#
# The tag without "v" and suffix must equal application/config/version in project.godot.
# Server environment of a tag without suffix: repository variable RELEASE_ENV, default development.
# Development stays the default until the production servers run and the project member switches
# (D-148): a build talks only to the servers of its environment, so a production build before
# then would be offline. Every development build is a pre-release.
#
# Optional, only with secrets (tools/ci/store_flags.sh decides; without them the steps are skipped
# and the run stays green): Windows signature, macOS signature + notarization, Google Play bundle
# (+ upload to "internal testing"), signed iOS IPA (+ TestFlight), Steam upload to a beta branch.
# Secrets and variables: docs/STORES.md. Android APK signing: tools/ci/android_signing.sh.
name: Release

on:
  push:
    tags: ["v*"]
    # Every push to dev publishes a test build (D-157). Path filters only apply to branch pushes:
    # docs and the browser build (Dokploy) alone do not start a release.
    branches: [dev]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "deploy/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/ci.yml"
      - ".github/assets/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "tools/make_github_images.py"
  workflow_dispatch:
    inputs:
      env:
        description: Server environment (development = test servers, always a pre-release)
        type: choice
        options: [development, production]
        default: development
      prerelease:
        description: Mark as pre-release (development builds always are)
        type: boolean
        default: true
      store_upload:
        description: Upload to Steam beta, Play internal testing and TestFlight (when their secrets are set)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A newer push to dev replaces a dev build still running; tag and manual releases always finish.
  cancel-in-progress: ${{ github.ref_type == 'branch' && github.event_name == 'push' }}

env:
  # One template list for the Linux export jobs, so they share one cache entry.
  GODOT_TEMPLATES: windows_release_x86_64.exe linux_release.x86_64 macos.zip android_release.apk android_source.zip
  # NDK of the Godot 4.7.2 Android build template (android/build/config.gradle, ndkVersion).
  ANDROID_NDK_PACKAGE: ndk;29.0.14206865
  # Dev pre-releases (push to dev) kept on GitHub; older ones and their tags are deleted.
  DEV_RELEASES_KEPT: 5

jobs:
  prepare:
    name: Version and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
      environment: ${{ steps.meta.outputs.environment }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      tag: ${{ steps.meta.outputs.tag }}
      create_tag: ${{ steps.meta.outputs.create_tag }}
      store_code: ${{ steps.meta.outputs.store_code }}
      aab: ${{ steps.flags.outputs.aab }}
      play_upload: ${{ steps.flags.outputs.play_upload }}
      ios_sign: ${{ steps.flags.outputs.ios_sign }}
      testflight: ${{ steps.flags.outputs.testflight }}
      macos_sign: ${{ steps.flags.outputs.macos_sign }}
      windows_sign: ${{ steps.flags.outputs.windows_sign }}
      steam: ${{ steps.flags.outputs.steam }}
    steps:
      - uses: actions/checkout@v5
      - name: Version, environment and tag
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          INPUT_ENV: ${{ inputs.env }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_ENV: ${{ vars.RELEASE_ENV }}
          RUN_NUMBER: ${{ github.run_number }}
        run: bash tools/ci/release_meta.sh
      - name: Signing and store secrets
        id: flags
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_STORE_UPLOAD: ${{ inputs.store_upload }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          MACOS_DEVELOPER_ID_CERT_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_BASE64 }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          STEAM_APP_ID: ${{ vars.STEAM_APP_ID }}
        run: bash tools/ci/store_flags.sh
      - name: Tag must be new (manual run)
        if: steps.meta.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG exists already. Raise application/config/version or run as pre-release."
            exit 1
          fi
      - id: godot
        uses: ./.github/actions/setup-godot
      - name: Validate project
        env:
          GODOT: ${{ steps.godot.outputs.godot }}
        run: '"$GODOT" --headless --audio-driver Dummy --path . -s tools/validate_project.gd'
      - name: Unit tests (GUT)
        env:
          GODOT: ${{ steps.godot.outputs.godot }}
          # Some tests expect the German texts of language "auto" (system language), as on the
          # team's PCs; Godot reads the system language from LANG on Linux.
          LANG: de_DE.UTF-8
        run: '"$GODOT" --headless --audio-driver Dummy --path . -s addons/gut/gut_cmdln.gd -gexit'

  desktop:
    name: Export Windows, Linux, macOS
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
      OUT_DIR: builds/${{ needs.prepare.outputs.environment }}/${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: godot
        uses: ./.github/actions/setup-godot
        with:
          templates: ${{ env.GODOT_TEMPLATES }}
      - name: Export
        env:
          GODOT: ${{ steps.godot.outputs.godot }}
          # The boot check below runs on the zip, explicitly without sound.
          SKIP_BOOT_TEST: "1"
          # Authenticode signature of Soulwick.exe (tools/ci/sign_windows.sh), only with secrets.
          WINDOWS_SIGN: ${{ needs.prepare.outputs.windows_sign == 'true' && '1' || '0' }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: bash tools/export_build.sh "$ENVIRONMENT" "$VERSION" "windows linux macos"
      - name: Boot check (Linux build)
        run: bash tools/ci/boot_check.sh "$OUT_DIR/Soulwick-$VERSION-$ENVIRONMENT-linux.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop
          path: |
            ${{ env.OUT_DIR }}/Soulwick-*-windows.zip
            ${{ env.OUT_DIR }}/Soulwick-*-linux.zip
          if-no-files-found: error
          compression-level: 0
      # Without notarization the ad-hoc signed zip goes into the release as it is.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.macos_sign == 'true' && 'macos-unsigned' || 'release-macos' }}
          path: ${{ env.OUT_DIR }}/Soulwick-*-macos.zip
          if-no-files-found: error
          compression-level: 0

  macos_sign:
    name: Sign and notarize macOS
    needs: [prepare, desktop]
    if: needs.prepare.outputs.macos_sign == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: macos-unsigned
          path: dist
      - name: Sign, notarize, staple
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_DEVELOPER_ID_CERT_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_BASE64 }}
          MACOS_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          for zip in dist/Soulwick-*-macos.zip; do
            bash tools/ci/macos_sign.sh "$zip"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/Soulwick-*-macos.zip
          if-no-files-found: error
          compression-level: 0

  android:
    name: Export Android APK
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      test_signed: ${{ steps.signing.outputs.test_signed }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
      OUT_DIR: builds/${{ needs.prepare.outputs.environment }}/${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      # Before Godot starts: the editor takes JAVA_HOME and ANDROID_HOME as its Android paths.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: bash tools/ci/android_sdk.sh
      - name: Signing key
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: bash tools/ci/android_signing.sh
      - id: godot
        uses: ./.github/actions/setup-godot
        with:
          templates: ${{ env.GODOT_TEMPLATES }}
      - name: Export
        env:
          GODOT: ${{ steps.godot.outputs.godot }}
        run: |
          bash tools/export_build.sh "$ENVIRONMENT" "$VERSION" android
          # Release file names: Soulwick-<version>-<env>-<platform>.<ext>
          mv "$OUT_DIR/Soulwick-$VERSION-$ENVIRONMENT.apk" "$OUT_DIR/Soulwick-$VERSION-$ENVIRONMENT-android.apk"
      - name: Check APK
        run: |
          apk="$OUT_DIR/Soulwick-$VERSION-$ENVIRONMENT-android.apk"
          "$ANDROID_BUILD_TOOLS/apksigner" verify --print-certs "$apk" | grep -E "Signer #1 certificate (DN|SHA-256)"
          "$ANDROID_BUILD_TOOLS/aapt" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code):"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: ${{ env.OUT_DIR }}/Soulwick-*-android.apk
          if-no-files-found: error
          compression-level: 0

  android_aab:
    name: Google Play bundle (AAB)
    needs: prepare
    if: needs.prepare.outputs.aab == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
      STORE_CODE: ${{ needs.prepare.outputs.store_code }}
      OUT_DIR: builds/${{ needs.prepare.outputs.environment }}/${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK and NDK
        env:
          EXTRA_PACKAGES: ${{ env.ANDROID_NDK_PACKAGE }}
        run: bash tools/ci/android_sdk.sh
      - name: Upload key
        env:
          REQUIRE_RELEASE_KEY: "1"
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash tools/ci/android_signing.sh
      - id: godot
        uses: ./.github/actions/setup-godot
        with:
          templates: ${{ env.GODOT_TEMPLATES }}
      # Gradle wrapper, plugin and libraries of the Godot template (about 500 MB, same for every run).
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-godot-4.7.2-${{ runner.os }}
      - name: Export AAB (Gradle)
        env:
          GODOT: ${{ steps.godot.outputs.godot }}
          VERSION_CODE: ${{ env.STORE_CODE }}
        run: bash tools/export_build.sh "$ENVIRONMENT" "$VERSION" android-aab
      - name: Check AAB
        run: bash tools/ci/check_aab.sh "$OUT_DIR/Soulwick-$VERSION-$ENVIRONMENT-android.aab" "$STORE_CODE"
      - uses: actions/upload-artifact@v4
        with:
          name: store-android-aab
          path: ${{ env.OUT_DIR }}/Soulwick-*-android.aab
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload to Google Play (internal testing)
        if: needs.prepare.outputs.play_upload == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK || 'internal' }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          PLAY_RELEASE_NAME: ${{ needs.prepare.outputs.tag }}
        run: bash tools/ci/play_upload.sh "$OUT_DIR/Soulwick-$VERSION-$ENVIRONMENT-android.aab"

  ios:
    name: iOS (Xcode project, IPA with secrets)
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    # Without Apple secrets this job only prepares the Xcode project; a problem there must not
    # turn the release red (the GitHub release does not wait for it).
    continue-on-error: ${{ needs.prepare.outputs.ios_sign != 'true' }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
      OUT_DIR: builds/${{ needs.prepare.outputs.environment }}/${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: godot
        uses: ./.github/actions/setup-godot
        with:
          templates: ios.zip
      - name: Export Xcode project
        env:
          GODOT: ${{ steps.godot.outputs.godot }}
          VERSION_CODE: ${{ needs.prepare.outputs.store_code }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash tools/export_build.sh "$ENVIRONMENT" "$VERSION" ios
      - uses: actions/upload-artifact@v4
        with:
          name: store-ios-xcode
          path: ${{ env.OUT_DIR }}/Soulwick-*-ios-xcode.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Archive, sign, IPA (and TestFlight)
        if: needs.prepare.outputs.ios_sign == 'true'
        env:
          IOS_UPLOAD: ${{ needs.prepare.outputs.testflight == 'true' && '1' || '0' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: bash tools/ci/ios_build.sh "$OUT_DIR/ios" "$OUT_DIR/Soulwick-$VERSION-$ENVIRONMENT-ios.ipa"
      - if: needs.prepare.outputs.ios_sign == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: store-ios-ipa
          path: ${{ env.OUT_DIR }}/Soulwick-*-ios.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  steam:
    name: Steam upload (beta branch)
    needs: [prepare, desktop, macos_sign]
    # Waits for the notarized macOS build when there is one; skipped without Steam secrets.
    if: >-
      !cancelled() && needs.prepare.outputs.steam == 'true' && needs.desktop.result == 'success' &&
      (needs.macos_sign.result == 'success' || needs.macos_sign.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: SteamPipe upload
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          STEAM_APP_ID: ${{ vars.STEAM_APP_ID }}
          STEAM_DEPOT_WINDOWS: ${{ vars.STEAM_DEPOT_WINDOWS }}
          STEAM_DEPOT_LINUX: ${{ vars.STEAM_DEPOT_LINUX }}
          STEAM_DEPOT_MACOS: ${{ vars.STEAM_DEPOT_MACOS }}
          # development builds may go to their own branch (variable STEAM_BRANCH_DEVELOPMENT).
          STEAM_BRANCH: ${{ needs.prepare.outputs.environment == 'development' && (vars.STEAM_BRANCH_DEVELOPMENT || vars.STEAM_BRANCH || 'beta') || (vars.STEAM_BRANCH || 'beta') }}
          # 1 = dry run (steamcmd checks everything, uploads nothing).
          STEAM_PREVIEW: ${{ vars.STEAM_PREVIEW || '0' }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: bash tools/steam/steam_upload.sh dist

  release:
    name: GitHub release
    needs: [prepare, desktop, macos_sign, android]
    if: >-
      !cancelled() && needs.desktop.result == 'success' && needs.android.result == 'success' &&
      (needs.macos_sign.result == 'success' || needs.macos_sign.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      CREATE_TAG: ${{ needs.prepare.outputs.create_tag }}
      ANDROID_TEST_SIGNED: ${{ needs.android.outputs.test_signed }}
      WINDOWS_SIGNED: ${{ needs.prepare.outputs.windows_sign }}
      MACOS_NOTARIZED: ${{ needs.macos_sign.result == 'success' }}
      WEB_PLAY_URL: ${{ vars.WEB_PLAY_URL }}
    steps:
      # Whole history and tags: the notes list the commits since the previous tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Store-only files (AAB, iOS) are artifacts of their jobs, not part of the public release.
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum Soulwick-* > "Soulwick-$VERSION-$ENVIRONMENT-SHA256SUMS.txt"
      - name: Release notes
        run: bash tools/ci/release_notes.sh "$RUNNER_TEMP/notes.md"
      - name: Create release
        run: |
          title="Soulwick $TAG"
          [ "$ENVIRONMENT" = "development" ] && title="$title (Testversion)"
          # A test-signed APK (no release key) marks the whole release as test only.
          if [ "$ANDROID_TEST_SIGNED" = "true" ]; then
            PRERELEASE=true
            [ "$ENVIRONMENT" = "development" ] || title="$title (nur Test)"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run of the same tag: replace the files and the text.
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md" --prerelease="$PRERELEASE"
            exit 0
          fi
          args=(--title "$title" --notes-file "$RUNNER_TEMP/notes.md")
          if [ "$CREATE_TAG" = "true" ]; then args+=(--target "$GITHUB_SHA"); else args+=(--verify-tag); fi
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); else args+=(--latest); fi
          gh release create "$TAG" dist/* "${args[@]}"
          echo "### Release $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove old dev pre-releases
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          # Newest first; keeps DEV_RELEASES_KEPT builds of the dev branch (tags v*-dev.N).
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$' \
            | tail -n +"$((DEV_RELEASES_KEPT + 1))" \
            | while read -r old; do
              echo "Deleting $old"
              gh release delete "$old" --yes --cleanup-tag
            done
